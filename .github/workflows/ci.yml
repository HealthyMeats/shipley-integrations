name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate integration manifests
        run: python3 tools/validate.py

      - name: No business-sensitive disclosure
        run: python3 tools/validate_disclosure.py

      - name: Farm links are attributed
        run: python3 tools/validate_links.py

      - name: Validate live site pages
        run: python3 tools/validate_site.py

      - name: The typo relay still has a way in
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python3 tools/validate_seed.py --require-live
          else
            python3 tools/validate_seed.py
          fi

      - name: Example runs offline against the fixture
        run: python3 examples/catalog_client.py --file fixtures/catalog.sample.json

      - name: Every Python file compiles
        run: python3 -m compileall -q examples integrations tools

      - name: Commits are signed off (DCO)
        if: github.event_name == 'pull_request'
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0
          while read -r sha; do
            [ -z "$sha" ] && continue
            if ! git log -1 --format=%B "$sha" | grep -qi '^Signed-off-by: .\+ <.\+@.\+>'; then
              echo "::error::$sha is missing a Signed-off-by line"
              missing=1
            fi
          done <<< "$(git rev-list "$base..$head")"
          if [ "$missing" -ne 0 ]; then
            echo "No Signed-off-by line. EVERY commit in a pull request needs one, so"
            echo "pushing one more commit will not clear this gate."
            echo ""
            echo "If you edited in the browser (the pencil icon), redo the edit with the"
            echo "sign-off in place:"
            echo "  1. In your fork, delete the branch behind this pull request."
            echo "  2. Edit the file again. In the commit box, put this line in the"
            echo "     Extended description field, not the title:"
            echo "       Signed-off-by: Your Name <your@email.com>"
            echo "  3. Open a new pull request. All 8 checks will run on it."
            echo ""
            echo "From a terminal: git rebase --signoff $base, then force-push the branch."
            echo ""
            echo "A maintainer cannot add this for you: it certifies that you wrote the"
            echo "change and have the right to submit it. If you are stuck, say so in a"
            echo "comment. We will walk you through it rather than close your work."
            exit 1
          fi
          echo "All commits signed off."
