name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate integration manifests
        run: python3 tools/validate.py

      - name: No business-sensitive disclosure
        run: python3 tools/validate_disclosure.py

      - name: Farm links are attributed
        run: python3 tools/validate_links.py

      - name: Validate live site pages
        run: python3 tools/validate_site.py

      - name: The typo relay still has a way in
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python3 tools/validate_seed.py --require-live
          else
            python3 tools/validate_seed.py
          fi

      - name: Example runs offline against the fixture
        run: python3 examples/catalog_client.py --file fixtures/catalog.sample.json

      - name: Every Python file compiles
        run: python3 -m compileall -q examples integrations tools

      - name: Commits are signed off (DCO)
        if: github.event_name == 'pull_request'
        # tools/check_signoff.py applies character for character the same rule the inline
        # grep did. What it adds is the reason: a sign-off that is present but misformatted
        # used to be reported as "No Signed-off-by line", which is false, and it cost us two
        # correct contributions (#12 and #15). The self-test runs first so a broken checker
        # cannot quietly pass a stranger's pull request, and it is announced as our fault.
        run: |
          python3 tools/check_signoff.py --self-test >/dev/null || {
            python3 tools/check_signoff.py --self-test || true
            echo "The sign-off checker is broken. That is our bug, not a contributor's."
            exit 1
          }
          python3 tools/check_signoff.py \
            --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
